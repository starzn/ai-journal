name: ai-journal

services:
  web:
    image: ${AI_JOURNAL_IMAGE:?set AI_JOURNAL_IMAGE}
    restart: unless-stopped
    read_only: true
    user: 101:101
    tmpfs:
      - /tmp:size=16m,mode=0755,uid=101,gid=101
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      starzn_internal:
        aliases:
          - ai-journal-web

networks:
  starzn_internal:
    external: true
    name: starzn_internal
