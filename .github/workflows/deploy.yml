name: Deploy immutable image

on:
  push:
    tags:
      - "deploy-ai-journal-*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy existing ACR image via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            tag='${{ github.ref_name }}'
            sha="${tag#deploy-ai-journal-}"
            test "$sha" = '${{ github.sha }}'
            /srv/apps/ai-journal/server-deploy.sh "$sha"
